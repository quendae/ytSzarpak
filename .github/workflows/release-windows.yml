name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read application version
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'src/YtDlpGui.App/YtDlpGui.App.csproj'
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw 'Could not read application version.' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=v$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building YTSzarpak v$version"

      - name: Run tests
        shell: pwsh
        run: dotnet test src/YtDlpGui.Tests/YtDlpGui.Tests.csproj -c Release

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/YtDlpGui.App/YtDlpGui.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/output/win-x64

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $exe = 'publish/output/win-x64/YTSzarpak.exe'
          if (-not (Test-Path $exe)) { throw 'YTSzarpak executable was not produced.' }

          $zip = "YTSzarpak-v$env:APP_VERSION-win-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'publish/output/win-x64/*' -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "/DMyAppVersion=$env:APP_VERSION" 'installer/YTSzarpak.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

          $installer = "publish/installer/YTSzarpak-v$env:APP_VERSION-Setup.exe"
          if (-not (Test-Path $installer)) { throw 'Installer was not produced.' }
          Copy-Item $installer (Split-Path $installer -Leaf) -Force

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $files = @(
            "YTSzarpak-v$env:APP_VERSION-Setup.exe",
            "YTSzarpak-v$env:APP_VERSION-win-x64-portable.zip"
          )

          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release asset: $file" }
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $file" | Set-Content "$file.sha256"
            Write-Host "$file SHA256: $hash"
          }

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $installer = "YTSzarpak-v$env:APP_VERSION-Setup.exe"
          $portable = "YTSzarpak-v$env:APP_VERSION-win-x64-portable.zip"
          $assets = @($installer, "$installer.sha256", $portable, "$portable.sha256")

          $notes = @"
          ## YTSzarpak v$env:APP_VERSION

          ### Downloads
          - **Installer:** `$installer` — recommended for normal Windows installation. Installs per-user, adds a Start menu shortcut and can optionally add a desktop shortcut. No administrator rights are required by default.
          - **Portable:** `$portable` — download, extract and run `YTSzarpak.exe`.

          ### Changes
          - Added a proper Windows installer with uninstall support.
          - Portable ZIP remains available for users who prefer a no-install version.
          - yt-dlp is now downloaded and updated from the official **nightly** build channel.
          - The application remains self-contained; a separate .NET or Python installation is not required.
          - yt-dlp and FFmpeg are managed by YTSzarpak at runtime.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
            $notes | gh release edit $tag --repo $env:GITHUB_REPOSITORY --title "YTSzarpak v$env:APP_VERSION" --notes-file -
          } else {
            $notes | gh release create $tag @assets `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "YTSzarpak v$env:APP_VERSION" `
              --notes-file -
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YTSzarpak-v${{ env.APP_VERSION }}-windows
          path: |
            YTSzarpak-v${{ env.APP_VERSION }}-Setup.exe
            YTSzarpak-v${{ env.APP_VERSION }}-Setup.exe.sha256
            YTSzarpak-v${{ env.APP_VERSION }}-win-x64-portable.zip
            YTSzarpak-v${{ env.APP_VERSION }}-win-x64-portable.zip.sha256
          if-no-files-found: error
