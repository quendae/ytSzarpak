name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish src/YtDlpGui.App/YtDlpGui.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishReadyToRun=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/output/win-x64

      - name: Verify executable and create ZIP
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/output/win-x64 -Filter '*.exe' | Select-Object -First 1
          if (-not $exe) { throw 'YTSzarpak executable was not produced.' }

          $zip = 'YTSzarpak-v1.0.1-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'publish/output/win-x64/*' -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $zip" | Set-Content 'YTSzarpak-v1.0.1-win-x64.sha256'

          Write-Host "Created $zip"
          Write-Host "SHA256: $hash"

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.1'
          $zip = 'YTSzarpak-v1.0.1-win-x64.zip'
          $sha = 'YTSzarpak-v1.0.1-win-x64.sha256'

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $sha --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $zip $sha `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'YTSzarpak v1.0.1' `
              --notes @'
          First packaged Windows release of YTSzarpak.

          - Windows x64, self-contained
          - No separate .NET or Python installation required
          - Includes the refreshed desktop interface
          - yt-dlp and FFmpeg are managed by the app at runtime

          Download the ZIP, extract it and run YTSzarpak.exe.
          '@
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTSzarpak-v1.0.1-win-x64
          path: |
            YTSzarpak-v1.0.1-win-x64.zip
            YTSzarpak-v1.0.1-win-x64.sha256
          if-no-files-found: error
